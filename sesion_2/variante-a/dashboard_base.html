<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · PIP</title>
<!--
  ╔══════════════════════════════════════════════════════════════════════════╗
  ║  DASHBOARD BASE · Taller PIP                                             ║
  ╠══════════════════════════════════════════════════════════════════════════╣
  ║  CÓMO USARLO                                                             ║
  ║  1. En el SQL Lab, corré una consulta y apretá "Copiar JSON".            ║
  ║  2. Buscá abajo el bloque `const DATA = { ... }` (es lo único que hay    ║
  ║     que editar) y pegá ese JSON en el campo `datos` del bloque que       ║
  ║     corresponda, reemplazando el ejemplo.                                ║
  ║  3. Decile al bloque cómo se llaman TUS columnas (`campoX`, `campo`...). ║
  ║  4. Borrá `ejemplo: true` (o ponelo en false) para que desaparezca el    ║
  ║     cartel de EJEMPLO.                                                   ║
  ║  5. Abrí este archivo en el navegador (doble click). Si algo está mal,   ║
  ║     la tarjeta te avisa qué revisar.                                     ║
  ║  6. Guardalo como `dashboard.html` y entregalo.                          ║
  ║                                                                          ║
  ║  Los números del tablero tienen que ser los MISMOS que dan tus consultas ║
  ╚══════════════════════════════════════════════════════════════════════════╝
-->
<style>
  /* Colores: paleta categórica validada (daltonismo + contraste), en este orden. */
  :root {
    color-scheme: light;
    --pagina: #f9f9f7; --superficie: #fcfcfb;
    --tinta: #0b0b0b; --tinta-2: #52514e; --tinta-3: #898781;
    --grilla: #e1e0d9; --eje: #c3c2b7; --borde: rgba(11,11,11,.10);
    --serie-1: #2a78d6; --serie-2: #eb6834; --serie-3: #1baf7a; --serie-4: #eda100;
    --serie-5: #e87ba4; --serie-6: #008300; --serie-7: #4a3aa7; --serie-8: #e34948;
    --acento-suave: #cde2fb; --cartel-bg: #fff4d6; --cartel-tinta: #6b4a00;
    --error-bg: #fdecea; --error-tinta: #8a1c12;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-tema="claro"])) {
      color-scheme: dark;
      --pagina: #0d0d0d; --superficie: #1a1a19;
      --tinta: #ffffff; --tinta-2: #c3c2b7; --tinta-3: #898781;
      --grilla: #2c2c2a; --eje: #383835; --borde: rgba(255,255,255,.10);
      --serie-1: #3987e5; --serie-2: #d95926; --serie-3: #199e70; --serie-4: #c98500;
      --serie-5: #d55181; --serie-6: #008300; --serie-7: #9085e9; --serie-8: #e66767;
      --acento-suave: #1d3550; --cartel-bg: #3a2e0c; --cartel-tinta: #ffd77a;
      --error-bg: #3a1d1b; --error-tinta: #ffb4ab;
    }
  }
  :root[data-tema="oscuro"] {
    color-scheme: dark;
    --pagina: #0d0d0d; --superficie: #1a1a19;
    --tinta: #ffffff; --tinta-2: #c3c2b7; --tinta-3: #898781;
    --grilla: #2c2c2a; --eje: #383835; --borde: rgba(255,255,255,.10);
    --serie-1: #3987e5; --serie-2: #d95926; --serie-3: #199e70; --serie-4: #c98500;
    --serie-5: #d55181; --serie-6: #008300; --serie-7: #9085e9; --serie-8: #e66767;
    --acento-suave: #1d3550; --cartel-bg: #3a2e0c; --cartel-tinta: #ffd77a;
    --error-bg: #3a1d1b; --error-tinta: #ffb4ab;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--pagina); color: var(--tinta); font: 15px/1.5 var(--sans); }
  .contenedor { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 16px; }
  header h1 { margin: 0; font-size: 24px; line-height: 1.2; }
  header p { margin: 4px 0 0; color: var(--tinta-2); }
  #btn-tema { margin-left: auto; font: 600 13px var(--sans); padding: 6px 12px; border-radius: 6px;
              border: 1px solid var(--borde); background: var(--superficie); color: var(--tinta); cursor: pointer; }

  .grilla-kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .grilla-graficos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .grilla-graficos .ancho { grid-column: 1 / -1; }
  @media (max-width: 860px) { .grilla-kpi { grid-template-columns: 1fr; } .grilla-graficos { grid-template-columns: 1fr; } }

  .tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: 10px; padding: 16px; min-width: 0; }
  .tarjeta h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .tarjeta .sub { margin: 0 0 10px; font-size: 13px; color: var(--tinta-2); }
  .kpi .etiqueta { font-size: 13px; color: var(--tinta-2); }
  .kpi .valor { font-size: 34px; font-weight: 600; line-height: 1.15; margin: 4px 0; }
  .kpi .nota { font-size: 13px; color: var(--tinta-3); }

  .cartel { display: inline-block; background: var(--cartel-bg); color: var(--cartel-tinta); font-size: 12px; font-weight: 700;
            padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; letter-spacing: .02em; }
  .lienzo { position: relative; height: 300px; }
  .lienzo.alto { height: 360px; }
  .error { background: var(--error-bg); color: var(--error-tinta); border-radius: 6px; padding: 10px 12px; font-size: 14px; }

  details.tabla-datos { margin-top: 10px; font-size: 13px; }
  details.tabla-datos summary { cursor: pointer; color: var(--tinta-2); }
  details.tabla-datos .scroll { max-height: 240px; overflow: auto; margin-top: 6px; border: 1px solid var(--borde); border-radius: 6px; }
  details.tabla-datos table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  details.tabla-datos th, details.tabla-datos td { padding: 3px 10px; text-align: left; border-bottom: 1px solid var(--grilla); white-space: nowrap; }
  details.tabla-datos th { position: sticky; top: 0; background: var(--superficie); }

  .conclusion p { margin: 0; white-space: pre-wrap; }
  footer { margin-top: 18px; font-size: 12.5px; color: var(--tinta-3); }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <div>
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </div>
    <button id="btn-tema" type="button" title="Cambiar entre automático, claro y oscuro">Tema: automático</button>
  </header>

  <section class="grilla-kpi" id="kpis" aria-label="Indicadores clave"></section>

  <section class="grilla-graficos">
    <article class="tarjeta ancho" id="tarjeta-linea"></article>
    <article class="tarjeta" id="tarjeta-barras"></article>
    <article class="tarjeta" id="tarjeta-torta"></article>
    <article class="tarjeta ancho conclusion" id="tarjeta-conclusion"></article>
  </section>

  <footer>Datos ficticios del taller PIP. Armado con el SQL Lab y Chart.js.</footer>
</div>

<!-- Chart.js 4.4.1 (UMD), versión fija. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   ✏️  ACÁ ES DONDE TRABAJÁS: este es el único bloque que tenés que editar.
   ═══════════════════════════════════════════════════════════════════════════

   Todo lo que dice "EJEMPLO" es de mentira (datos inventados para que veas cómo
   funciona). Reemplazalo por los resultados de TUS consultas.

   REGLAS GENERALES
   • `datos` es el JSON que copiás del SQL Lab con el botón "Copiar JSON":
     una lista de objetos, uno por fila:  [ {"columna1": ..., "columna2": ...}, ... ]
   • Los campos `campo...` (campoX, campoEtiqueta, campoValor, campo) son el NOMBRE
     DE LA COLUMNA de tu consulta. Si tu consulta devuelve una columna `mes_num`,
     poné campoX: "mes_num". Mayúsculas y minúsculas importan.
   • Podés ponerle alias a las columnas en tu SQL (AS) para que coincidan.
   • Cuando termines un bloque, borrá la línea `ejemplo: true` (o poné false).
*/
const DATA = {

  /* ── Encabezado ───────────────────────────────────────────────────────── */
  titulo: "Torre de control · Informe 2025",          // ✏️ Poné el título de tu tablero
  subtitulo: "Equipo: (poné acá el nombre de tu escuadra)",

  /* ── 3 tarjetas de KPI (indicadores) ───────────────────────────────────
     Un KPI es UN número que resume algo importante.
     • valor:     el número (sin formato). Sale de una consulta tuya.
     • decimales: cuántos decimales mostrar.
     • sufijo:    texto después del número ("%", " min", "").
     • nota:      una aclaración corta, por ejemplo cómo definiste el indicador.
     Tienen que coincidir con lo que dan tus consultas. */
  kpis: [
    { etiqueta: "Vuelos operados",      valor: 1234, decimales: 0, sufijo: "",   nota: "EJEMPLO — reemplazá por tus datos", ejemplo: true },
    { etiqueta: "Puntualidad",          valor: 55.5, decimales: 1, sufijo: "%",  nota: "EJEMPLO — reemplazá por tus datos", ejemplo: true },
    { etiqueta: "Ocupación promedio",   valor: 66.6, decimales: 1, sufijo: "%",  nota: "EJEMPLO — reemplazá por tus datos", ejemplo: true },
  ],

  /* ── Gráfico de LÍNEA: evolución en el tiempo (por ejemplo, por mes) ────
     Pegá en `datos` UN solo JSON con una fila por mes. Cada columna que
     quieras dibujar va en `series`.
     Formato esperado, por ejemplo:
        [ {"mes": "2025-01", "puntualidad": 71.2, "ocupacion": 84.0}, ... ]
     ⚠️ Todas las series comparten UN solo eje vertical. Poné juntas sólo cosas
        de la misma escala (por ejemplo dos porcentajes). No mezcles "cantidad de
        vuelos" con "porcentaje": hacé otro gráfico o dejá una sola serie. */
  linea: {
    ejemplo: true,                                    // ✏️ borrá esta línea cuando uses tus datos
    titulo: "Evolución mensual",
    subtitulo: "EJEMPLO — reemplazá por tus datos",
    campoX: "mes",                                    // columna con el eje horizontal
    series: [                                         // una entrada por línea a dibujar
      { campo: "serie_a", nombre: "Serie A (ejemplo)" },
      { campo: "serie_b", nombre: "Serie B (ejemplo)" },
    ],
    sufijo: "%",                                      // se agrega a los números ("%", "")
    decimales: 1,
    ejeY: { min: 0, max: 100 },                       // opcional: borrá la línea para escala automática
    datos: [                                          // 👈 acá pegás tu JSON
      { mes: "2025-01", serie_a: 40, serie_b: 70 }, { mes: "2025-02", serie_a: 45, serie_b: 64 },
      { mes: "2025-03", serie_a: 43, serie_b: 66 }, { mes: "2025-04", serie_a: 50, serie_b: 62 },
      { mes: "2025-05", serie_a: 52, serie_b: 65 }, { mes: "2025-06", serie_a: 49, serie_b: 61 },
      { mes: "2025-07", serie_a: 58, serie_b: 72 }, { mes: "2025-08", serie_a: 55, serie_b: 63 },
      { mes: "2025-09", serie_a: 57, serie_b: 60 }, { mes: "2025-10", serie_a: 60, serie_b: 64 },
      { mes: "2025-11", serie_a: 62, serie_b: 61 }, { mes: "2025-12", serie_a: 64, serie_b: 67 },
    ],
  },

  /* ── Gráfico de BARRAS: un ranking (por ejemplo, las 10 rutas críticas) ──
     Formato esperado, por ejemplo:
        [ {"ruta": "COR → MDZ", "ocupacion": 91.2}, ... ]
     Tip: si tu consulta devuelve origen y destino por separado, podés armar la
     etiqueta en SQL pegándolos:  origen || ' → ' || destino AS ruta
     Las barras salen en el orden en que vienen: ordená en tu SQL (ORDER BY). */
  barras: {
    ejemplo: true,
    titulo: "Ranking",
    subtitulo: "EJEMPLO — reemplazá por tus datos",
    campoEtiqueta: "ruta",                            // columna con el nombre de cada barra
    campoValor: "valor",                              // columna con el número
    sufijo: "%",
    decimales: 1,
    datos: [
      { ruta: "Ruta de ejemplo 1", valor: 93.1 }, { ruta: "Ruta de ejemplo 2", valor: 91.4 },
      { ruta: "Ruta de ejemplo 3", valor: 89.9 }, { ruta: "Ruta de ejemplo 4", valor: 87.0 },
      { ruta: "Ruta de ejemplo 5", valor: 84.2 }, { ruta: "Ruta de ejemplo 6", valor: 80.5 },
    ],
  },

  /* ── Gráfico de TORTA/DONA: cómo se reparte un total (pocas partes: 2 a 5) ──
     Formato esperado, por ejemplo:
        [ {"area": "Propia", "minutos": 12345}, {"area": "Externa", "minutos": 9876} ] */
  torta: {
    ejemplo: true,
    titulo: "Reparto",
    subtitulo: "EJEMPLO — reemplazá por tus datos",
    campoEtiqueta: "grupo",
    campoValor: "total",
    sufijo: "",
    decimales: 0,
    datos: [
      { grupo: "Grupo 1 (ejemplo)", total: 600 },
      { grupo: "Grupo 2 (ejemplo)", total: 400 },
    ],
  },

  /* ── Conclusión / recomendación ───────────────────────────────────────────
     Máximo 3 líneas para el Director: qué encontraron y qué recomiendan.
     Usá \n para separar renglones. */
  conclusion: {
    ejemplo: true,
    titulo: "Recomendación para el Director",
    texto: "EJEMPLO — reemplazá por tus datos.\nLínea 1: qué encontraron (con números de sus consultas).\nLínea 2: qué recomiendan hacer.",
  },
};

/* ═══════════════════════════════════════════════════════════════════════════
   🔒 De acá para abajo no hace falta tocar nada (es el motor del tablero).
   ═══════════════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const fmt = (n, dec) => new Intl.NumberFormat("es-AR", { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }).format(n);
const css = (nombre) => getComputedStyle(document.documentElement).getPropertyValue(nombre).trim();
let graficos = [];   // instancias de Chart.js vivas (para destruirlas al cambiar el tema)

function crear(tag, clase, texto) {
  const e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

/* Valida que `datos` sea una lista no vacía y que existan las columnas pedidas. */
function validar(nombreBloque, datos, campos) {
  if (!Array.isArray(datos) || datos.length === 0) {
    throw new Error("`datos` tiene que ser una lista con al menos una fila (pegá el JSON que copiaste del Lab).");
  }
  const disponibles = Object.keys(datos[0]);
  for (const c of campos) {
    if (!(c in datos[0])) {
      throw new Error("No encuentro la columna \"" + c + "\" en tus datos. Las columnas que hay son: " + disponibles.join(", ") + ".");
    }
  }
}

function mostrarError(tarjeta, nombreBloque, e) {
  tarjeta.append(crear("div", "error", "Revisá el bloque «" + nombreBloque + "» de DATA. " + e.message));
}

function cartelEjemplo(tarjeta) {
  tarjeta.append(crear("span", "cartel", "EJEMPLO — reemplazá por tus datos"));
}

function encabezado(tarjeta, bloque) {
  if (bloque.ejemplo) cartelEjemplo(tarjeta);
  tarjeta.append(crear("h2", "", bloque.titulo || ""));
  if (bloque.subtitulo) tarjeta.append(crear("p", "sub", bloque.subtitulo));
}

/* Vista de tabla: alternativa accesible al gráfico, con los mismos datos. */
function tablaDeDatos(tarjeta, datos, columnas) {
  const det = crear("details", "tabla-datos");
  det.append(crear("summary", "", "Ver los datos en tabla"));
  const scroll = crear("div", "scroll");
  const t = crear("table");
  const cab = crear("tr");
  columnas.forEach((c) => cab.append(crear("th", "", c)));
  t.append(cab);
  datos.forEach((fila) => {
    const tr = crear("tr");
    columnas.forEach((c) => tr.append(crear("td", "", fila[c] === null || fila[c] === undefined ? "" : String(fila[c]))));
    t.append(tr);
  });
  scroll.append(t);
  det.append(scroll);
  tarjeta.append(det);
}

function estiloBase() {
  return {
    texto: css("--tinta-2"), suave: css("--tinta-3"), grilla: css("--grilla"), eje: css("--eje"),
    superficie: css("--superficie"), tinta: css("--tinta"),
    series: [1, 2, 3, 4, 5, 6, 7, 8].map((i) => css("--serie-" + i)),
  };
}

function lienzo(tarjeta, descripcion, alto) {
  const caja = crear("div", "lienzo" + (alto ? " alto" : ""));
  const canvas = crear("canvas");
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", descripcion);
  caja.append(canvas);
  tarjeta.append(caja);
  return canvas;
}

/* ── KPIs ─────────────────────────────────────────────────────────────── */
function dibujarKpis() {
  const cont = $("kpis");
  cont.textContent = "";
  DATA.kpis.slice(0, 3).forEach((k) => {
    const t = crear("div", "tarjeta kpi");
    if (k.ejemplo) cartelEjemplo(t);
    t.append(crear("div", "etiqueta", k.etiqueta));
    const v = Number(k.valor);
    t.append(crear("div", "valor", isFinite(v) ? fmt(v, k.decimales) + (k.sufijo || "") : "—"));
    if (k.nota && !(k.ejemplo && /^EJEMPLO/.test(k.nota))) t.append(crear("div", "nota", k.nota));
    cont.append(t);
  });
}

/* ── Línea ────────────────────────────────────────────────────────────── */
function dibujarLinea() {
  const b = DATA.linea, tarjeta = $("tarjeta-linea");
  tarjeta.textContent = "";
  encabezado(tarjeta, b);
  try {
    validar("linea", b.datos, [b.campoX].concat(b.series.map((s) => s.campo)));
    const e = estiloBase();
    const canvas = lienzo(tarjeta, "Gráfico de líneas: " + (b.titulo || ""), false);
    const unidad = b.sufijo || "";
    const g = new Chart(canvas, {
      type: "line",
      data: {
        labels: b.datos.map((f) => f[b.campoX]),
        datasets: b.series.map((s, i) => ({
          label: s.nombre || s.campo,
          data: b.datos.map((f) => Number(f[s.campo])),
          borderColor: e.series[i % 8], backgroundColor: e.series[i % 8],
          borderWidth: 2, tension: 0, borderJoinStyle: "round", borderCapStyle: "round",
          pointRadius: 4, pointHoverRadius: 6, pointBackgroundColor: e.series[i % 8],
          pointBorderColor: e.superficie, pointBorderWidth: 2,   // anillo del color de la superficie
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          x: { grid: { display: false }, border: { color: e.eje }, ticks: { color: e.suave } },
          y: Object.assign({ grid: { color: e.grilla }, border: { display: false },
            ticks: { color: e.suave, callback: (v) => fmt(v, 0) + unidad } }, b.ejeY || {}),
        },
        plugins: {
          legend: { display: b.series.length >= 2, labels: { color: e.texto, usePointStyle: true, boxWidth: 8 } },
          tooltip: { callbacks: { label: (c) => " " + c.dataset.label + ": " + fmt(c.parsed.y, b.decimales) + unidad } },
        },
      },
    });
    graficos.push(g);
    tablaDeDatos(tarjeta, b.datos, [b.campoX].concat(b.series.map((s) => s.campo)));
  } catch (err) { mostrarError(tarjeta, "linea", err); }
}

/* ── Barras (horizontales: aguantan nombres largos) ───────────────────── */
const etiquetasEnBarras = {
  id: "etiquetasEnBarras",
  afterDatasetsDraw(chart, _a, opts) {
    if (!opts || !opts.formato) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.fillStyle = opts.color;
    ctx.font = "12px system-ui, sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    chart.getDatasetMeta(0).data.forEach((barra, i) => {
      ctx.fillText(opts.formato(chart.data.datasets[0].data[i]), barra.x + 6, barra.y);
    });
    ctx.restore();
  },
};

function dibujarBarras() {
  const b = DATA.barras, tarjeta = $("tarjeta-barras");
  tarjeta.textContent = "";
  encabezado(tarjeta, b);
  try {
    validar("barras", b.datos, [b.campoEtiqueta, b.campoValor]);
    const e = estiloBase();
    const unidad = b.sufijo || "";
    const canvas = lienzo(tarjeta, "Gráfico de barras: " + (b.titulo || ""), true);
    const g = new Chart(canvas, {
      type: "bar",
      plugins: [etiquetasEnBarras],
      data: {
        labels: b.datos.map((f) => f[b.campoEtiqueta]),
        datasets: [{
          data: b.datos.map((f) => Number(f[b.campoValor])),
          backgroundColor: e.series[0], maxBarThickness: 24,
          borderRadius: { topRight: 4, bottomRight: 4, topLeft: 0, bottomLeft: 0 }, borderSkipped: false,
        }],
      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 56 } },
        scales: {
          x: { beginAtZero: true, grid: { color: e.grilla }, border: { display: false }, ticks: { color: e.suave, callback: (v) => fmt(v, 0) + unidad } },
          y: { grid: { display: false }, border: { color: e.eje }, ticks: { color: e.texto } },
        },
        plugins: {
          legend: { display: false },     // una sola serie: el título ya dice qué se muestra
          tooltip: { callbacks: { label: (c) => " " + fmt(c.parsed.x, b.decimales) + unidad } },
          etiquetasEnBarras: { color: e.texto, formato: (v) => fmt(v, b.decimales) + unidad },
        },
      },
    });
    graficos.push(g);
    tablaDeDatos(tarjeta, b.datos, [b.campoEtiqueta, b.campoValor]);
  } catch (err) { mostrarError(tarjeta, "barras", err); }
}

/* ── Torta / dona ─────────────────────────────────────────────────────── */
function dibujarTorta() {
  const b = DATA.torta, tarjeta = $("tarjeta-torta");
  tarjeta.textContent = "";
  encabezado(tarjeta, b);
  try {
    validar("torta", b.datos, [b.campoEtiqueta, b.campoValor]);
    if (b.datos.length > 5) throw new Error("Una torta con más de 5 partes no se lee bien. Agrupá las más chicas en \"Otras\" desde tu SQL.");
    const e = estiloBase();
    const unidad = b.sufijo || "";
    const valores = b.datos.map((f) => Number(f[b.campoValor]));
    const total = valores.reduce((a, x) => a + x, 0);
    const canvas = lienzo(tarjeta, "Gráfico de dona: " + (b.titulo || ""), false);
    const g = new Chart(canvas, {
      type: "doughnut",
      data: {
        labels: b.datos.map((f) => f[b.campoEtiqueta]),
        datasets: [{ data: valores, backgroundColor: b.datos.map((_, i) => e.series[i % 8]),
                     borderColor: e.superficie, borderWidth: 2 }],   // el borde separa los gajos
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: "62%",
        plugins: {
          legend: { position: "bottom", labels: { color: e.texto, usePointStyle: true, boxWidth: 8 } },
          tooltip: { callbacks: { label: (c) => " " + c.label + ": " + fmt(c.parsed, b.decimales) + unidad +
                                   " (" + fmt(100 * c.parsed / total, 1) + "%)" } },
        },
      },
    });
    graficos.push(g);
    tablaDeDatos(tarjeta, b.datos, [b.campoEtiqueta, b.campoValor]);
  } catch (err) { mostrarError(tarjeta, "torta", err); }
}

/* ── Conclusión ───────────────────────────────────────────────────────── */
function dibujarConclusion() {
  const b = DATA.conclusion, tarjeta = $("tarjeta-conclusion");
  tarjeta.textContent = "";
  if (b.ejemplo) cartelEjemplo(tarjeta);
  tarjeta.append(crear("h2", "", b.titulo || "Conclusión"));
  tarjeta.append(crear("p", "", b.texto || ""));
}

/* ── Armado general ───────────────────────────────────────────────────── */
function dibujarTodo() {
  graficos.forEach((g) => g.destroy());
  graficos = [];
  document.title = (DATA.titulo || "Dashboard") + " · PIP";
  $("titulo").textContent = DATA.titulo || "";
  $("subtitulo").textContent = DATA.subtitulo || "";
  dibujarKpis();
  dibujarLinea();
  dibujarBarras();
  dibujarTorta();
  dibujarConclusion();
}

/* Tema: automático (según el sistema) → claro → oscuro. Se redibuja para usar los colores del tema. */
const TEMAS = ["auto", "claro", "oscuro"];
const ETIQUETA_TEMA = { auto: "Tema: automático", claro: "Tema: claro", oscuro: "Tema: oscuro" };
let temaActual = "auto";
function aplicarTema() {
  if (temaActual === "auto") document.documentElement.removeAttribute("data-tema");
  else document.documentElement.setAttribute("data-tema", temaActual);
  $("btn-tema").textContent = ETIQUETA_TEMA[temaActual];
  dibujarTodo();
}
$("btn-tema").addEventListener("click", () => {
  temaActual = TEMAS[(TEMAS.indexOf(temaActual) + 1) % TEMAS.length];
  aplicarTema();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (temaActual === "auto") dibujarTodo(); });

if (typeof Chart === "undefined") {
  document.querySelector(".contenedor").prepend(crear("div", "error",
    "No pude descargar Chart.js desde internet. Revisá tu conexión y recargá la página (F5)."));
} else {
  dibujarTodo();
}
</script>
